name: Fetch site assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/fatima-cake-website-ctwcca

      - name: Download and optimize assets
        run: bash scripts/fetch-assets.sh

      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images public/videos
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore: add optimized site assets (images + hero video)"
          git push
