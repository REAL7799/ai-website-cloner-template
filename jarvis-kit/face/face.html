<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Jarvis Face</title>
<meta name="description" content="Rosto animado do Personal Jarvis, sincronizado com a voz em tempo real." />
<meta name="theme-color" content="#07080A" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #07080a;
    --bg-2: #0d0f13;
    --ink: #eef0ea;
    --ink-dim: #8a8f98;
    --ink-faint: #4a4f57;
    --line: rgba(238, 240, 234, 0.08);
    --accent: #5ce1e6;
    --ok: #5ce1e6;
    --warn: #ffb547;
    --err: #ff5a5f;
    --font-ui: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none;
  }
  canvas#face {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; cursor: pointer; outline: none;
  }
  canvas#face:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }

  .hud {
    position: fixed; left: 0; right: 0; top: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 22px; pointer-events: none;
  }
  .brand {
    font-family: var(--font-ui); font-weight: 600;
    letter-spacing: 0.32em; font-size: 13px; color: var(--ink);
  }
  .brand small {
    display: block; margin-top: 4px; letter-spacing: 0.08em;
    font-family: var(--font-mono); font-weight: 400; font-size: 10.5px; color: var(--ink-faint);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 7px 12px 7px 10px;
    border: 1px solid var(--line); border-radius: 999px;
    background: rgba(13, 15, 19, 0.72);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--ink-dim);
  }
  .chip i {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--chip-dot, var(--ink-faint));
    box-shadow: 0 0 10px var(--chip-dot, transparent);
    transition: background 240ms ease, box-shadow 240ms ease;
  }

  .captions {
    position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%);
    width: min(760px, calc(100vw - 32px));
    text-align: center; pointer-events: none;
    transition: opacity 300ms ease;
  }
  .captions[hidden] { display: block; opacity: 0; }
  .cap-user {
    min-height: 1.4em; margin: 0 0 6px;
    font-family: var(--font-mono); font-size: 13px; color: var(--ink-faint);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cap-user::before { content: "tu  ›  "; color: var(--ink-faint); opacity: 0.7; }
  .cap-user:empty::before { content: ""; }
  .cap-jarvis {
    margin: 0; min-height: 2.8em;
    font-size: clamp(16px, 2.1vw, 21px); line-height: 1.4; font-weight: 500;
    color: var(--ink); text-wrap: balance;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .footer {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 22px; pointer-events: none;
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.05em; color: var(--ink-faint);
  }
  kbd {
    font-family: inherit; padding: 1px 6px; border-radius: 4px;
    border: 1px solid var(--line); color: var(--ink-dim);
  }
  .banner {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, 150px);
    max-width: calc(100vw - 32px);
    font-family: var(--font-mono); font-size: 12px; color: var(--ink-dim);
    text-align: center; pointer-events: none; transition: opacity 400ms ease;
  }
  .banner[hidden] { display: block; opacity: 0; }

  @media (max-width: 560px) {
    .hud { padding: 14px 16px; }
    .footer { padding: 12px 16px; }
    .footer .keys { display: none; }
    .captions { bottom: 48px; }
    .cap-jarvis { -webkit-line-clamp: 3; min-height: 4.2em; }
  }
</style>
</head>
<body>
  <canvas id="face" tabindex="0" role="button"
          aria-label="Rosto do Jarvis. Clica ou carrega em Espaço para falar."></canvas>

  <header class="hud">
    <div class="brand">JARVIS<small id="sub">personal assistant</small></div>
    <div class="chip" id="chip" role="status" aria-live="polite"><i></i><span id="chip-label">a ligar…</span></div>
  </header>

  <section class="captions" id="captions" aria-live="polite">
    <p class="cap-user" id="cap-user"></p>
    <p class="cap-jarvis" id="cap-jarvis"></p>
  </section>

  <div class="banner" id="banner" hidden></div>

  <footer class="footer">
    <span class="keys"><kbd>Espaço</kbd> falar · <kbd>Esc</kbd> desligar · <kbd>C</kbd> legendas · <kbd>F</kbd> ecrã inteiro</span>
    <span id="link-label">—</span>
  </footer>

  <script src="face3d.js"></script>
</body>
</html>
